name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Cache Docker images
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: docker-${{ runner.os }}-ddev-lint-${{ hashFiles('.ddev/config.yaml') }}

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1

      - name: Install dependencies
        run: ddev composer install

      - name: Lint composer
        run: ddev composer lint:composer

      - name: Lint EditorConfig
        run: ddev composer lint:editorconfig

      - name: Lint PHP (php-cs-fixer)
        run: ddev composer lint:php

      - name: Static analysis (PHPStan)
        run: ddev composer sca:php

  tests:
    name: Tests (PHP ${{ matrix.php-version }}, TYPO3 ${{ matrix.typo3-version }}, ${{ matrix.test-type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']
        typo3-version: ['13', '14']
        test-type: ['unit', 'functional']
        include:
          - typo3-version: '13'
            typo3-constraint: '^13.4'
          - typo3-version: '14'
            typo3-constraint: '^14.0'

    steps:
      - uses: actions/checkout@v6

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-typo3${{ matrix.typo3-version }}-php${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-typo3${{ matrix.typo3-version }}-php${{ matrix.php-version }}-

      - name: Cache Docker images
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: docker-${{ runner.os }}-ddev-php${{ matrix.php-version }}-${{ hashFiles('.ddev/config.yaml') }}

      - name: Set PHP version
        env:
          PHP_VERSION: ${{ matrix.php-version }}
        run: |
          sed -i "s/^php_version:.*/php_version: ${PHP_VERSION}/" .ddev/config.yaml

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1

      - name: Install dependencies for TYPO3 ${{ matrix.typo3-version }}
        run: |
          ddev composer update \
            --with "typo3/cms-core:${{ matrix.typo3-constraint }}" \
            --with "typo3/cms-install:${{ matrix.typo3-constraint }}" \
            --no-interaction --prefer-stable

      - name: Run tests
        run: ddev composer test:${{ matrix.test-type }}
