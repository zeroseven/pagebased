name: pagebased
type: typo3
docroot: .build/public
php_version: "8.3"
webserver_type: nginx-fpm
router_http_port: "80"
router_https_port: "443"
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
database:
  type: mariadb
  version: "10.11"
nodejs_version: "20"
webimage_extra_packages: [php-pcov]
use_dns_when_possible: true
composer_version: "2"
web_environment:
  - TYPO3_CONTEXT=Development/DDEV
  - TYPO3_PATH_APP=/var/www/html
  - typo3DatabaseHost=db
  - typo3DatabaseUsername=root
  - typo3DatabasePassword=root
  - typo3DatabaseName=db
corepack_enable: false
hooks:
  post-start:
    - composer: install
    # Local dev: trust all host headers so the ddev hostname (and port-based URLs)
    # are accepted. Written to additional.php, which setup/install-tool never overwrites.
    - exec: |
        if [ -f /var/www/html/config/system/settings.php ]; then
          cat > /var/www/html/config/system/additional.php <<'PHP'
        <?php
        $GLOBALS['TYPO3_CONF_VARS']['SYS']['trustedHostsPattern'] = '.*';
        PHP
        fi
